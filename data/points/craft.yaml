  address: Vạn Phúc, Hà Đông
  hook:
    vi: The La, lĩnh Bưởi, chồi Phùng, Lụa vân Vạn Phúc, nhiễu vùng Mỗ bên.
    en: ""
  story:
    vi:
      - Vạn Phúc dệt lụa đã hơn nghìn năm, nổi tiếng nhất với lụa vân — loại lụa có hoa văn chìm, phải nhìn nghiêng mới thấy, dệt bằng cách thay đổi lối bắt sợi chứ không phải in hay thêu. Thời Pháp, lụa Hà Đông được mang đi dự đấu xảo và xuất sang châu Âu. Ngày nay cả làng vừa dệt vừa bán, phố lụa thành điểm du lịch, và nhiều nhà thiết kế trẻ về đây đặt vải riêng cho bộ sưu tập của mình.
    en: []
  fact:
    vi: Lụa vân chỉ hiện hoa văn khi ánh sáng chiếu xiên. Cùng một tấm, nhìn thẳng là trơn, nghiêng đi là nổi hình.
    en: ""
