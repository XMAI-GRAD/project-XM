  story:
    vi:
      - Từ thế kỷ 17, thợ đúc đồng từ các làng nghề về lập nghiệp trên bán đảo giữa hồ Trúc Bạch, dần thành trường đúc lớn nhất kinh thành. Tượng Huyền Thiên Trấn Vũ ở đền Quán Thánh và tượng A Di Đà ở chùa Thần Quang ngay trong làng đều ra lò từ đất này.
      - Nghề đúc đòi hỏi làm khuôn đất, nấu đồng ở nhiệt độ rất cao, rồi rót một lần duy nhất — hỏng là phải đập khuôn làm lại từ đầu. Hôm nay, cả làng còn hai hộ giữ nghề.
    en: []
  fact:
    vi: Nghệ nhân Nguyễn Văn Ứng, sinh năm 1949, là đời thứ mười sáu trong gia đình làm nghề này. Con trai ông vẫn đang tiếp tục.
