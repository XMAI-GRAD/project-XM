    label:
      vi: Điểm đại diện — Đình Nam Hương, 75 Hàng Trống; xem tranh theo triển lãm
      en: Representative point — Nam Hương communal house, 75 Hàng Trống; exhibitions vary
  name:
    vi: Hàng Trống
    en: Hang Trong — folk painting
  craft:
    vi: Tranh dân gian
    en: ""
  hours:
    # [GĐ] in the source PDF, p. 8–9; retained as editorial reference, not live operational data.
    vi: Xem theo triển lãm
    en: ""
  address: Phố Hàng Trống
  hook:
    vi: Cả một dòng tranh, nay còn một nhà cầm bút.
    en: ""
  story:
    vi:
      - Tranh Hàng Trống từng là tranh treo ngày Tết của người Hà Nội. Khác tranh Đông Hồ, tranh Hàng Trống chỉ in nét đen bằng ván gỗ, còn màu thì tô tay. Người thợ dùng bút lông tô từng mảng rồi vờn đậm nhạt ngay trên nét in — kỹ thuật gọi là cản màu, cho bức tranh chiều sâu mà bản khắc không làm được. Khi tranh in công nghiệp tràn vào, nghề mai một gần hết. Vài năm gần đây, hoa văn Hàng Trống trở lại trên sản phẩm thiết kế đương đại.
    en: []
  fact:
    vi: Phố Hàng Trống xưa bán cả trống lẫn tranh — trống treo ngoài cửa, tranh bày bên trong. Nay chỉ còn cái tên giữ lại cả hai nghề.
    en: ""
  nearby:
