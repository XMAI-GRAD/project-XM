  story:
    vi:
      - Bún thang là món của những ngày sau Tết. Khi mâm cỗ đã vãn, người Hà Nội gom những thứ còn lại — giò lụa, thịt gà, trứng tráng, tôm khô — thái chỉ rồi bày lên bát bún, chan nước dùng trong veo.
      - Một bát đầy đủ cần hơn hai mươi nguyên liệu, và gần như thứ gì cũng phải thái nhỏ như sợi chỉ, xếp thành từng ô màu riêng trên mặt bát. Món sinh ra từ việc tiếc của, nhưng lại thành món cầu kỳ bậc nhất của bếp Hà Nội.
    en: []
  fact:
    vi: Nước dùng bún thang phải trong đến mức nhìn thấy đáy bát. Chỉ một chút váng mỡ là người sành ăn biết ngay nồi nước chưa đạt.
