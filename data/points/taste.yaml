    en: Young green rice from Vong village
  dish:
    vi: Cốm tươi gói lá sen
    en: ""
  price:
    # [GĐ] in the source PDF, p. 7–8; retained as editorial reference, not live operational data.
    vi: 30.000 – 40.000 đ/lạng
    en: ""
  hours:
    # [GĐ] in the source PDF, p. 7–8; retained as editorial reference, not live operational data.
    vi: 7h00–18h00
    en: ""
  season: autumn
  address: Làng Vòng, Dịch Vọng Hậu
  hook:
    vi: Cốm Vòng, gạo tám Mễ Trì, Tương Bần, húng Láng còn gì ngon hơn.
    en: ""
  story:
    vi:
      - "Cốm làm từ lúa nếp non, gặt đúng lúc hạt vừa chắc mà vẫn còn sữa. Lúa về được rang trong chảo gang, đảo liên tục bằng tay cho chín đều, rồi giã trong cối — giã nhẹ và giã nhiều lần, mỗi lần lại sàng bỏ vỏ trấu. Hạt cốm cuối cùng mỏng, dẻo, xanh màu lá mạ. Cốm gói trong lá sen buộc bằng rơm nếp: lá sen giữ ẩm và cho mùi, rơm giữ dáng gói. Mùa cốm mỗi năm chỉ kéo dài vài tuần."
    en: []
  fact:
    vi: Cốm phải ăn bằng tay, nhón từng nhúm nhỏ. Dùng thìa là cốm vón lại, mất đi độ tơi vốn là thứ người ta tìm ở món này.
    en: ""
