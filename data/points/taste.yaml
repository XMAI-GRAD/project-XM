  story:
    vi:
      - Sen Hồ Tây chỉ nở vào mùa hạ, và chè sen long nhãn là cách người Hà Nội giữ lại mùa ấy trong một bát nhỏ. Hạt sen tươi bóc vỏ, lẩy sạch tâm cho hết vị đắng, hấp vừa chín tới để không nát. Long nhãn tách hạt nhưng giữ nguyên hình. Rồi từng hạt sen được lồng vào trong quả nhãn — việc làm hoàn toàn bằng tay, không máy nào thay được. Nước đường thả vài cánh nhài, để nguội, ăn lạnh.
    en: []
  fact:
    vi: Một mẻ chè sen long nhãn chuẩn mất gần nửa ngày chuẩn bị, phần lớn thời gian chỉ để lồng sen vào nhãn từng quả một.
