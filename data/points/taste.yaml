      - Năm 1871, một gia đình họ Đoàn mở hàng chả cá trên phố Hàng Sơn. Món ăn nổi tiếng đến mức người Hà Nội gọi luôn con phố là phố Chả Cá, và cái tên ấy thành tên chính thức cho đến tận bây giờ — con phố duy nhất của Hà Nội mang tên một món ăn. Cá lăng ướp nghệ và riềng, nướng trên than rồi mang lên bàn trong chảo mỡ đang sôi, ăn cùng thì là, hành hoa, bún và mắm tôm. Bếp than đặt ngay giữa bàn, nên đây là món của mùa lạnh.
    en: []
