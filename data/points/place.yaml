  story:
    vi:
      - Khánh thành năm 1903 sau bốn năm xây dựng, Long Biên là cây cầu thép đầu tiên bắc qua sông Hồng, nối nội thành với vùng đất bên kia sông. Trong chiến tranh, cầu bị đánh bom nhiều lần, có nhịp gãy rồi được nối lại bằng dầm khác hẳn kiểu cũ — nên đến nay nhìn dọc thân cầu vẫn thấy rõ chỗ nào là nguyên bản, chỗ nào là vá. Tàu hỏa, xe máy và người đi bộ vẫn qua cầu mỗi ngày.
    en: []
  fact:
    vi: Trên cầu Long Biên, xe chạy phía bên trái — thói quen từ thời Pháp còn giữ lại, khác mọi con đường khác ở Việt Nam.
