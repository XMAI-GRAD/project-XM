    vi: Rủ nhau xem cảnh Kiếm Hồ, Xem cầu Thê Húc, xem chùa Ngọc Sơn.
    en: ""
  story:
    vi:
      - Hồ Hoàn Kiếm không phải nơi lớn nhất hay cổ nhất Hà Nội, nhưng là nơi thành phố tự nhận ra mình. Tên hồ gắn với truyền thuyết vua Lê trả gươm cho rùa thần sau khi đuổi xong giặc — một câu chuyện về việc buông quyền lực, không phải giành lấy nó. Đền Ngọc Sơn trên đảo nối vào bờ bằng cầu Thê Húc sơn đỏ. Quanh hồ, mỗi sáng vẫn là người tập thể dục, mỗi cuối tuần là phố đi bộ.
    en: []
  fact:
    vi: Tháp Rùa giữa hồ chỉ dựng cuối thế kỷ 19, muộn hơn truyền thuyết nó gợi nhắc tới gần bốn trăm năm.
