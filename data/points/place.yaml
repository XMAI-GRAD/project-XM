  story:
    vi:
      - "{b:Trường đại học đầu tiên của Việt Nam}, mở cửa từ năm 1076. {b:Văn Miếu} dựng năm 1070 để thờ Khổng Tử. Sáu năm sau, {b:Quốc Tử Giám} ra đời bên cạnh, ban đầu dạy con vua, rồi dần mở cho người tài khắp nước. Trong gần bảy trăm năm, đây là nơi đào tạo quan lại của cả quốc gia."
      - Tám mươi hai tấm bia đá dựng trên lưng rùa ghi tên 1.307 tiến sĩ qua các khoa thi — danh sách đầy đủ nhất còn lại về trí thức Việt Nam thời quân chủ. Người đến đây hôm nay vẫn xoa đầu rùa trước mùa thi.
    en: []
  fact:
    vi: Khuê Văn Các mà ai cũng chụp ảnh chỉ dựng năm 1805 — trẻ hơn Văn Miếu hơn bảy trăm năm. Nay nó thành biểu tượng chính thức của Hà Nội.
    en: ""
