      - "Khu khảo cổ 18 Hoàng Diệu cho thấy rõ điều đó: móng cung điện của bốn thời kỳ nằm trong cùng một hố đào, cái sau cắt qua cái trước. Năm 2010, UNESCO công nhận {b:Hoàng thành} là Di sản Thế giới, đúng dịp Hà Nội tròn một nghìn tuổi."
    en: []
