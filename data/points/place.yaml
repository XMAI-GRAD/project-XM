    vi:
      - Từ thế kỷ 11, đây là trung tâm chính trị của nước Việt qua các triều Lý, Trần, Lê rồi Nguyễn. Mỗi triều dựng cung điện của mình lên trên nền của triều trước, nên lòng đất ở đây không phải một lớp mà là nhiều lớp chồng nhau.
      - "Khu khảo cổ 18 Hoàng Diệu cho thấy rõ điều đó: móng cung điện của bốn thời kỳ nằm trong cùng một hố đào, cái sau cắt qua cái trước. Năm 2010, UNESCO công nhận Hoàng thành là Di sản Thế giới, đúng dịp Hà Nội tròn một nghìn tuổi."
