    en: ""
  story:
    vi:
      - "Khu phố cổ hình thành từ các làng nghề kéo về kinh thành buôn bán. Mỗi phố nhận một mặt hàng và lấy luôn tên hàng ấy: Hàng Bạc đúc bạc, Hàng Trống làm trống và vẽ tranh, Hàng Thiếc gò thiếc, Hàng Đường bán ô mai và bánh. Nhà ở đây là nhà ống — mặt tiền hẹp vì thuế tính theo bề ngang, nhưng sâu hun hút về phía sau, có sân trong lấy sáng. Nhiều phố nay đã đổi hàng, nhưng tên thì vẫn giữ nguyên nghề cũ."
    en: []
  fact:
    vi: Phố Chả Cá vốn tên Hàng Sơn, đổi tên theo món ăn của một hàng nổi tiếng trên phố — con phố duy nhất Hà Nội mang tên một món ăn.
