      - "{b:Khu phố cổ} hình thành từ các làng nghề kéo về kinh thành buôn bán. Mỗi phố nhận một mặt hàng và lấy luôn tên hàng ấy: {b:Hàng Bạc} đúc bạc, {b:Hàng Trống} làm trống và vẽ tranh, {b:Hàng Thiếc} gò thiếc, {b:Hàng Đường} bán ô mai và bánh."
