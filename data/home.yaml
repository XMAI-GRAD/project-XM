lead:
  vi: Trung tâm Điều phối các Hoạt động Sáng tạo Hà Nội. Nơi Nhà nước, nghệ sĩ và công chúng cùng làm nên thành phố.
  en: ""
intro:
  title:
    vi: Một thành phố sáng tạo không bắt đầu từ cái mới, mà từ chỗ cái cũ được nối tiếp
    en: ""
  body:
    vi:
      - "Hà Nội đã có đủ: di sản nghìn năm, làng nghề còn sống, và hàng nghìn người đang làm sáng tạo mỗi ngày. Cái thiếu không phải một Hà Nội mới, mà là chỗ để những thứ đang có gặp nhau."
      - Hanoi Creative City là chỗ đó — điểm điều phối giữa Nhà nước, nghệ sĩ và công chúng.
    en: []
