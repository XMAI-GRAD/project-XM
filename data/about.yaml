title:
  vi: Giới thiệu
  en: About us
# Beside the title: who this page is about. Not in the content document; built from its copy.
lede:
  vi: Trung tâm Điều phối các Hoạt động Sáng tạo Hà Nội, đầu mối của Hanoi Creative City, Thành phố Sáng tạo của UNESCO trong lĩnh vực Thiết kế.
  en: The Hanoi Creative Activities Coordination Center, the hub of Hanoi Creative City, a UNESCO Creative City of Design.
# The first three paragraphs condense hanoicreativecity.com/gioi-thieu-2/ (figures from 2018).
unesco:
  title:
    vi: Hà Nội gia nhập hệ thống Thành phố Sáng tạo của UNESCO
    en: Hanoi joins the UNESCO Creative Cities Network
  body:
    vi:
      - Từ Thăng Long hơn nghìn năm trước, Hà Nội lớn lên giữa 20 con sông, trên 3.329 km², và nay là nhà của 7,9 triệu người. Thành phố giữ hàng nghìn di sản, 1.350 làng nghề và một cộng đồng nhà thiết kế, nghệ sĩ, nhà đổi mới đang lớn dần.
      - Năm 1999, UNESCO vinh danh Hà Nội là Thành phố vì Hòa bình. Hai mươi năm sau, thành phố chọn đặt thiết kế sáng tạo vào trung tâm của phát triển bền vững, với mục tiêu trở thành một trung tâm sáng tạo hàng đầu Đông Nam Á.
      - Là thành viên Mạng lưới Thành phố Sáng tạo UNESCO, Hà Nội hợp tác với Berlin, Seoul, Kobe, Singapore và nhiều thành phố khác, dùng thiết kế để gìn giữ di sản, giải các bài toán đô thị và khuyến khích người trẻ theo đuổi thiết kế, đổi mới.
      - Trung tâm Điều phối các Hoạt động Sáng tạo Hà Nội thành lập theo Quyết định số 5067/QĐ-UBND ngày 27/9/2024 của Ủy ban nhân dân Thành phố Hà Nội, chính thức hoạt động từ tháng 12/2024, đặt trong khuôn viên Bảo tàng Hà Nội.
    en:
      - From Thang Long more than a thousand years ago, Hanoi grew up among 20 rivers, over 3,329 km², and is now home to 7.9 million people. The city keeps thousands of heritage sites, 1,350 craft villages and a growing community of designers, artists and innovators.
      - In 1999, UNESCO named Hanoi a City for Peace. Twenty years on, the city chose to put creative design at the heart of sustainable growth, aiming to become one of Southeast Asia's leading creative hubs.
      - As a member of the UNESCO Creative Cities Network, Hanoi works with Berlin, Seoul, Kobe, Singapore and other cities, and uses design to protect its heritage, solve urban problems and draw young people into design and innovation.
      - The Hanoi Creative Activities Coordination Center was set up by Decision No. 5067/QĐ-UBND of the Hanoi People's Committee on 27 September 2024. It opened in December 2024, on the grounds of the Hanoi Museum.
