work:
  title:
    vi: Ba việc chúng tôi làm
    en: Three things we do
  items:
    - title:
        vi: Chứng nhận
        en: Certify
      body:
        vi: Xác nhận và bảo chứng cho sáng tạo mang tên Hà Nội.
        en: We vouch for creative work that carries Hanoi's name.
    - title:
        vi: Kết nối
        en: Connect
      body:
        vi: Đưa người làm nghề gặp nguồn lực, đối tác và mạng lưới UNESCO.
        en: We bring makers to resources, partners and the UNESCO network.
    - title:
        vi: Bệ phóng
        en: Launch
      body:
        vi: Đồng hành từ ý tưởng đầu tiên đến lúc ra thị trường.
        en: We stay with a project from the first idea to the market.
